[package]
name = "swiftx"
version = "0.3.0"
edition = "2021"
authors = ["SwiftX Contributors"]
description = "SwiftX Browser - hizli, guvenli ve acik kaynakli web tarayicisi"
license = "MIT"
readme = "../README.md"
rust-version = "1.77"
keywords = ["browser", "webview", "wry", "tao"]
categories = ["gui", "web-programming"]

[dependencies]
tao = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
raw-window-handle = "0.6"
rfd = "0.18"
ureq = "3"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
wry = { version = "0.57", features = ["devtools", "linux-body"] }
gtk = "0.18"
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }

[target.'cfg(not(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd")))'.dependencies]
wry = { version = "0.57", features = ["devtools"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
