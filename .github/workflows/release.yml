name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: swiftx-linux-x86_64
            raw: swiftx
          - os: windows-latest
            artifact: swiftx-windows-x86_64
            raw: swiftx.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build release
        working-directory: rust
        run: cargo build --release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/swiftx
          cp rust/target/release/swiftx dist/swiftx/
          cp -r rust/resources dist/swiftx/resources
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" swiftx
          cp rust/target/release/swiftx "${{ matrix.raw }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/swiftx | Out-Null
          Copy-Item rust/target/release/swiftx.exe dist/swiftx/
          Copy-Item -Recurse rust/resources dist/swiftx/resources
          Compress-Archive -Path dist/swiftx -DestinationPath "${{ matrix.artifact }}.zip"
          Copy-Item rust/target/release/swiftx.exe "${{ matrix.raw }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
            ${{ matrix.raw }}
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
            ${{ matrix.raw }}
          generate_release_notes: true
          fail_on_unmatched_files: false
